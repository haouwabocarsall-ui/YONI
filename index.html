<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YONI — Ton avenir commence ici</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a, #172554, #312e81);
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: auto;
      padding: 40px 0;
    }

    .logo {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 35px;
      font-size: 18px;
    }

    .card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 22px;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin-bottom: 20px;
      font-size: 24px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      display: none;
    }

    .profile {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .plan {
      line-height: 1.7;
      color: #e2e8f0;
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      background: rgba(34,197,94,0.2);
      border-radius: 20px;
      margin: 5px 5px 15px 0;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      margin-top: 30px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">YONI</div>

    <p class="subtitle">
      Ton avenir commence ici 🚀
    </p>

    <div class="card">
      <h2>Découvrons ton objectif</h2>

      <label for="objectif">Que veux-tu atteindre ?</label>

      <select id="objectif">
        <option value="">Choisis ton objectif</option>
        <option value="emploi">Trouver un emploi</option>
        <option value="competences">Développer mes compétences</option>
        <option value="freelance">Commencer le freelance</option>
        <option value="entrepreneuriat">Créer mon activité</option>
      </select>

      <label for="interet">Quel domaine t'intéresse ?</label>

      <select id="interet">
        <option value="">Choisis un domaine</option>
        <option value="digital">Digital & technologie</option>
        <option value="commerce">Commerce & business</option>
        <option value="creation">Création & communication</option>
        <option value="social">Social & impact</option>
      </select>

      <label for="niveau">Quel est ton niveau ?</label>

      <select id="niveau">
        <option value="">Choisis ton niveau</option>
        <option value="debutant">Débutant</option>
        <option value="intermediaire">Intermédiaire</option>
        <option value="avance">Avancé</option>
      </select>

      <button onclick="generateProfile()">
        Découvrir mon parcours YONI ✨
      </button>
    </div>

    <div class="card" id="result">

      <div class="badge">Profil YONI</div>

      <div class="profile" id="profile"></div>

      <p id="description" class="plan"></p>

      <br>

      <h2>Ton plan des 30 prochains jours 📅</h2>

      <p id="plan" class="plan"></p>

      <button onclick="window.scrollTo({top:0, behavior:'smooth'})">
        Modifier mes réponses
      </button>

    </div>

    <footer>
      YONI — Construisons ensemble ton avenir.
    </footer>

  </div>

  <script>
async function generateProfile() {
  const objectif = document.getElementById("objectif").value;
  const interet = document.getElementById("interet").value;
  const niveau = document.getElementById("niveau").value;

  if (!objectif || !interet || !niveau) {
    alert("Choisis une réponse dans chaque catégorie.");
    return;
  }

  const profileElement = document.getElementById("profile");
  const descriptionElement = document.getElementById("description");
  const planElement = document.getElementById("plan");
  const resultElement = document.getElementById("result");
  const button = document.querySelector('button[onclick="generateProfile()"]');

  profileElement.textContent = "⏳ YONI analyse ton profil...";
  descriptionElement.textContent = "YONI prépare ton analyse personnalisée...";
  planElement.textContent = "Création de ton parcours...";
  resultElement.style.display = "block";
  resultElement.scrollIntoView({ behavior: "smooth" });
  if (button) button.disabled = true;

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: `Analyse ce profil YONI et adapte réellement les conseils aux trois réponses.

Objectif : ${objectif}
Domaine : ${interet}
Niveau : ${niveau}

Réponds en français simple, avec des conseils pratiques adaptés au niveau choisi.
Présente exactement ces trois rubriques :
PROFIL : un nom court pour le profil
DESCRIPTION : une analyse personnalisée de quelques phrases
PLAN :
Semaine 1 : ...
Semaine 2 : ...
Semaine 3 : ...
Semaine 4 : ...`
      })
    });

    let data;
    try {
      data = await response.json();
    } catch {
      throw new Error("Le serveur a renvoyé une réponse illisible.");
    }

    if (!response.ok) {
      throw new Error(data.error || "Erreur serveur");
    }

    // Accepte les noms de réponse les plus courants côté API.
    const texte = data.response || data.output_text || data.texte_de_sortie || "";

    if (!texte.trim()) {
      throw new Error("La réponse de YONI est vide. Vérifie la réponse de l’API.");
    }

    const profilIA = texte.match(/(?:^|\n)\s*PROFIL\s*[:\-]\s*(.*)/i);
    const descriptionIA = texte.match(/DESCRIPTION\s*[:\-]\s*([\s\S]*?)(?=\n\s*PLAN\s*[:\-]|$)/i);
    const planIA = texte.match(/PLAN\s*[:\-]\s*([\s\S]*)/i);

    profileElement.textContent = profilIA
      ? profilIA[1].trim()
      : "🎯 Profil YONI";

    descriptionElement.textContent = descriptionIA
      ? descriptionIA[1].trim()
      : texte.trim();

    planElement.textContent = planIA
      ? planIA[1].trim()
      : "Ton parcours est personnalisé selon tes réponses. Consulte l’analyse ci-dessus pour les recommandations.";

    resultElement.style.display = "block";
    resultElement.scrollIntoView({ behavior: "smooth" });
  } catch (error) {
    console.error("Erreur YONI :", error);
    profileElement.textContent = "YONI";
    descriptionElement.textContent =
      error.message || "Une erreur est survenue pendant l’analyse. Réessaie dans quelques instants.";
    planElement.textContent = "";
    resultElement.style.display = "block";
  } finally {
    if (button) button.disabled = false;
  }
}

  </script>

</body>
</html>
